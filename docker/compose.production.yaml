name: fedbank

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fedbank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe random password in docker/production.env}
      POSTGRES_DB: vault_monitoring
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
      - ../backend/use_cases/vault_monitoring/migrations:/migrations:ro
    networks: [data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fedbank -d vault_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  alert-service:
    image: fedbank/alert-service:${IMAGE_TAG:?Set IMAGE_TAG in docker/production.env}
    build:
      context: ..
      dockerfile: backend/services/alert_service/Dockerfile
    environment:
      ALERT_DATABASE_URL: postgresql+psycopg://fedbank:${POSTGRES_PASSWORD}@postgres:5432/alert_service
      ALERT_PRODUCER_CREDENTIALS: >-
        {"${VAULT_ALERT_PRODUCER_TOKEN:?Set a unique vault producer token}":{"use_case":"vault_monitoring","producer":"vault-monitoring"},"${BRANCH_ALERT_PRODUCER_TOKEN:?Set a unique branch producer token}":{"use_case":"branch_exterior","producer":"branch-exterior-monitoring"},"${FACE_MASK_ALERT_PRODUCER_TOKEN:?Set a unique face mask producer token}":{"use_case":"face_mask","producer":"face-mask-monitoring"}}
      ALERT_OPERATOR_CREDENTIALS: >-
        {"${ALERT_SERVICE_OPERATOR_TOKEN:?Set an operator token}":{"actor_id":"production-operator","use_cases":["*"]}}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data, egress]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  vault-monitoring:
    image: fedbank/vault-monitoring:${IMAGE_TAG:?Set IMAGE_TAG in docker/production.env}
    build:
      context: ..
      dockerfile: backend/use_cases/vault_monitoring/Dockerfile
    environment:
      APP_NAME: Fedbank Vault Monitoring
      DEBUG: "false"
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg2://fedbank:${POSTGRES_PASSWORD}@postgres:5432/vault_monitoring
      QDRANT_URL: ${QDRANT_URL:?Set the managed Qdrant URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set the managed Qdrant API key}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-face_embeddings}
      CORS_ALLOW_ORIGINS: '["https://${DOMAIN:?Set a public DNS name}"]'
      VAULT_ROOM_API_KEY: ${VAULT_ROOM_API_KEY:?Set the vault operator key}
      VAULT_REQUIRED_PERSONS: "2"
      VAULT_ALLOW_MODE_SELECT: "false"
      LIVENESS_TEST_ENABLED: "false"
      WARMUP_MODEL_ON_STARTUP: "false"
      ALERT_SERVICE_BASE_URL: http://alert-service:8012
      ALERT_SERVICE_TOKEN: ${VAULT_ALERT_PRODUCER_TOKEN}
    volumes:
      - vault-uploads:/app/uploads
      - vault-runtime:/app/var
      - vault-deepface-cache:/home/app/.deepface
      - vault-model-cache:/home/app/.cache
      - vault-roboflow-cache:/home/app/.roboflow
    depends_on:
      postgres:
        condition: service_healthy
      alert-service:
        condition: service_healthy
    networks: [data, egress]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp:size=256m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  branch-exterior:
    image: fedbank/branch-exterior:${IMAGE_TAG:?Set IMAGE_TAG in docker/production.env}
    build:
      context: ..
      dockerfile: backend/use_cases/branch_exterior/Dockerfile
    environment:
      APP_NAME: Fedbank Branch Exterior Monitoring
      ENVIRONMENT: production
      API_PREFIX: /api
      CORS_ORIGINS: https://${DOMAIN}
      DB_ENGINE: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: fedbank
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: branch_monitoring
      STORAGE_DIR: storage
      SINGLE_ACTIVE_CAMERA: "true"
      PERSON_DETECTOR_BACKEND: rfdetr
      INFERENCE_DEVICE: cpu
      INFERENCE_FALLBACK_TO_CPU: "true"
      ALERT_SERVICE_BASE_URL: http://alert-service:8012
      ALERT_SERVICE_TOKEN: ${BRANCH_ALERT_PRODUCER_TOKEN}
    volumes:
      - branch-storage:/app/storage
      - branch-config:/app/config
      - branch-model-cache:/home/app/.cache
      - branch-roboflow-cache:/home/app/.roboflow
    depends_on:
      postgres:
        condition: service_healthy
      alert-service:
        condition: service_healthy
    networks: [data, egress]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp:size=256m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/api/health', timeout=6).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 180s

  face-mask:
    image: fedbank/face-mask:${IMAGE_TAG:?Set IMAGE_TAG in docker/production.env}
    build:
      context: ..
      dockerfile: backend/use_cases/face_mask/Dockerfile
    environment:
      APP_NAME: Fedbank Face Mask Monitoring
      ENVIRONMENT: production
      API_PREFIX: /api
      CORS_ORIGINS: https://${DOMAIN}
      DB_SQLITE_PATH: storage/app.db
      ALERT_SERVICE_BASE_URL: http://alert-service:8012
      ALERT_SERVICE_TOKEN: ${FACE_MASK_ALERT_PRODUCER_TOKEN}
    volumes:
      - face-mask-storage:/app/storage
    depends_on:
      alert-service:
        condition: service_healthy
    networks: [data, egress]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp:size=256m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8014/api/health', timeout=6).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s

  frontend:
    image: fedbank/frontend:${IMAGE_TAG:?Set IMAGE_TAG in docker/production.env}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_VAULT_API_BASE_URL: /vault-api
        VITE_BRANCH_EXTERIOR_API_BASE_URL: /branch-api
        VITE_FACE_MASK_API_BASE_URL: /face-mask-api
        VITE_ALERT_SERVICE_BASE_URL: /alert-service
    environment:
      VAULT_ROOM_API_KEY: ${VAULT_ROOM_API_KEY}
      ALERT_SERVICE_OPERATOR_TOKEN: ${ALERT_SERVICE_OPERATOR_TOKEN}
    depends_on:
      vault-monitoring:
        condition: service_healthy
      branch-exterior:
        condition: service_healthy
      face-mask:
        condition: service_healthy
      alert-service:
        condition: service_healthy
    networks: [ingress, data]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set a public DNS name in docker/production.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set the TLS certificate contact email}
      AUTH_GATEWAY_UPSTREAM: ${AUTH_GATEWAY_UPSTREAM:?Set the OIDC forward-auth host}
      AUTH_GATEWAY_PATH: ${AUTH_GATEWAY_PATH:-/oauth2/auth}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [ingress]
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

networks:
  ingress:
  data:
    internal: true
  egress:

volumes:
  postgres-data:
  vault-uploads:
  vault-runtime:
  vault-deepface-cache:
  vault-model-cache:
  vault-roboflow-cache:
  branch-storage:
  branch-config:
  branch-model-cache:
  branch-roboflow-cache:
  face-mask-storage:
  caddy-data:
  caddy-config:
