# Face Mask - tunable settings (SPEC FM-10: no threshold is hard-coded in code).
# Defaults are the SPEC section 7 TBC values; confirm with the client before production.
# Override the file location with FACE_MASK_CONFIG_PATH.

visibility:
  analyzer: heuristic            # heuristic | classifier
  threshold: 0.60                # CONCEALED score needed to count a frame as concealed
  classifier_model_path: ../../../data/model_weights/face_mask_visibility.onnx   # used when analyzer=classifier and the file exists

confirmation:
  frames_to_confirm: 5           # N concealed frames ...
  confirm_window: 8              # ... out of the last M evaluated frames

quality_gate:
  min_head_height_px: 48
  min_sharpness: 60.0            # variance of Laplacian
  min_brightness: 40.0
  max_brightness: 220.0
  max_yaw_degrees: 55.0

entering:
  window_frames: 10              # movement is measured over the last N frames
  min_inward_displacement_px: 12.0
  head_crop_ratio: 0.35          # upper part of the person box searched for the head

evidence:
  clip_pre_seconds: 5.0
  clip_post_seconds: 5.0
  snapshot_quality: 85

cooldown:
  seconds: 30.0                  # suppress duplicate events from track fragmentation ...
  radius_px: 120.0               # ... near the same place on the same camera

alerts:
  severity: high
  channels:
    dashboard: true
    sms: false
    email: false
    app: false

stream:
  processing_fps: 8
  frame_width: 1280

detector:
  person_model_size: auto        # auto | nano | small | medium | large
  person_confidence: 0.40
  person_low_confidence: 0.20

tracker:
  min_hits: 2
  confirm_confidence: 0.70
  max_lost_seconds: 5.0

uploads:
  max_size_mb: 1024
  allowed_extensions: [".mp4", ".avi", ".mov", ".mkv", ".webm"]
