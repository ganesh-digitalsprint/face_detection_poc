zone_types:
  - key: gate_leaf_roi
    label: Sliding gate leaf
    description: Polygon around the physical sliding gate leaf; used as its visual reference region.
  - key: gate_approach
    label: Gate approach
    description: Outside approach region before the gate threshold.
  - key: gate_trigger
    label: Gate trigger
    description: Region near the gate threshold used for gate monitoring context.
  - key: gate_crossing
    label: Gate crossing corridor
    description: Polygon corridor around the crossing area; directional crossing uses a separate calibrated virtual line.
  - key: gate_interior
    label: Gate interior
    description: Inside region on the bank-premises side of the gate.
  - key: mesh_area
    label: Mesh gathering area
    description: Independent region used to configure group-presence monitoring.
