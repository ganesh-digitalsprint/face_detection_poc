[project]
name = "branch-exterior-monitoring-poc"
version = "0.1.0"
description = "Branch Exterior Monitoring & Anomaly Detection - POC backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",
    "oracledb>=2.4.0",
    "motor>=3.5.0",
    "opencv-contrib-python-headless==4.10.0.84",  # contrib = cv2.face, needed for guard recognition
    "scipy>=1.11.0",                              # Hungarian matching in ByteTrack
    "rfdetr>=1.3.0",                              # RF-DETR detector (Apache-2.0; pulls in torch)
    "rtmlib>=0.0.13",                             # RTMPose keypoints via onnxruntime (Apache-2.0)
    "onnxruntime>=1.18.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# rfdetr / rtmlib depend on the *regular* opencv wheels. Two cv2 builds in one
# environment overwrite each other, so those names are disabled and the single
# contrib-headless build above is used instead.
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
    "opencv-python-headless; sys_platform == 'never'",
    "opencv-contrib-python; sys_platform == 'never'",
]

[tool.ruff]
line-length = 110
target-version = "py311"
